GUYS.forEach(g=>{g.img=new Image();g.img.src=g.src});
function drawGuy(p){
  const g=GUYS[p.id%2],top=p.top+GAP,ph=GROUND-top;
  const H=Math.max(ph,120),photoH=H*.68,pw=photoH*g.ratio;
  const cx=p.x+PW/2,lean=-0.05,bob=Math.sin(frame/18+p.id)*0.8;
  ctx.save();ctx.translate(cx,GROUND+5);ctx.rotate(lean);
  const legTop=-H+photoH-6,lw=pw*.40,ln='#1d2b36';
  ctx.lineWidth=2;ctx.strokeStyle=ln;ctx.lineJoin='round';
  // back leg (straight)
  let x0=-pw*.20;
  ctx.fillStyle=g.pants;ctx.beginPath();
  ctx.moveTo(x0-lw/2,legTop);ctx.lineTo(x0+lw/2,legTop);ctx.lineTo(x0+lw*.36,-H*.06);ctx.lineTo(x0-lw*.36,-H*.06);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=g.shoe;ctx.beginPath();ctx.roundRect(x0-lw*.55,-H*.06,lw*1.05,H*.06,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=g.sole;ctx.fillRect(x0-lw*.53,-3,lw*1.01,3);
  // front leg (crossed, toe tapping)
  let x1=pw*.20,x2=-pw*.02;
  ctx.fillStyle=g.pants;ctx.beginPath();
  ctx.moveTo(x1-lw/2,legTop);ctx.lineTo(x1+lw/2,legTop);ctx.lineTo(x2+lw*.40,-H*.07);ctx.lineTo(x2-lw*.32,-H*.07);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=g.pantsHi;ctx.fillRect(x1-lw*.3,legTop+4,4,H*.1);
  ctx.fillStyle=g.shoe;ctx.beginPath();ctx.roundRect(x2-lw*.62,-H*.07,lw*1.1,H*.07,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=g.sole;ctx.fillRect(x2-lw*.60,-3,lw*1.06,3);
  // torso photo
  if(g.img.complete&&g.img.naturalWidth)ctx.drawImage(g.img,-pw/2,-H+bob,pw,photoH);
  ctx.restore();

let actx=null,tapBuf=null,lastTap=0,tapRate=1;
function initAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const bin=atob(TAP_B64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    actx.decodeAudioData(u.buffer,b=>{tapBuf=b},()=>{});
  }catch(e){actx=null}
}
function tapSound(){
  initAudio();if(!actx)return;
  if(actx.state==='suspended')actx.resume();
  if(!tapBuf)return;
  const now=performance.now(),dt=(now-lastTap)/1000;lastTap=now;
  // slow tap (>=0.6s) -> normal speed; rapid tapping -> up to 2.2x
  const target=dt>1?1:Math.min(2.2,Math.max(1,0.6/dt));
  tapRate=dt>1?1:tapRate*.5+target*.5;
  const src=actx.createBufferSource();src.buffer=tapBuf;src.playbackRate.value=tapRate;
  const g=actx.createGain();g.gain.value=.9;
  src.connect(g);g.connect(actx.destination);src.start();
}

addEventListener('keydown',e=>{
  if(state==='select'){
    if(e.code==='ArrowLeft'||e.code==='ArrowRight'){sel=(sel+(e.code==='ArrowRight'?1:2))%3;e.preventDefault()}
    else if(e.code==='Digit1')choose(0);else if(e.code==='Digit2')choose(1);else if(e.code==='Digit3')choose(2);
    else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();if(!e.repeat)choose(sel)}
    return}
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)flap()}});
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hit(e){const p=pt(e);return CARDS.findIndex(c=>p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h)}
cv.addEventListener('pointermove',e=>{if(state==='select'){const i=hit(e);if(i>=0)sel=i}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='select'){const i=hit(e);if(i>=0)choose(i);return}flap()});
function die(){state='over';overT=0;shake=10;if(score>best){best=score;try{localStorage.setItem('ff_best',best)}catch(e){}}}
function update(){
  if(state!=='over')groundX=(groundX-SPEED)%24;
  clouds.forEach(c=>{c.x-=.25*c.s;if(c.x<-120)c.x=W+40});
  if(state==='select'){frame++;bird.y=-200;return}
  if(state==='ready'){bird.y=H/2-40+Math.sin(frame/12)*8;bird.r=0;frame++;return}
  if(state==='over')overT++;
  bird.v=Math.min(bird.v+GRAV,MAXFALL);bird.y+=bird.v;
  bird.r=Math.max(-.45,Math.min(.7,bird.v*.05));
  if(state==='play'){
    frame++;
    if(frame===1||frame%115===0){pipes.push({x:W+10,top:90+Math.random()*(GROUND-GAP-180),scored:false,id:pipeN++})}
    pipes.forEach(p=>{p.x-=SPEED;if(!p.scored&&p.x+PW<bird.x){p.scored=true;score++}});
    pipes=pipes.filter(p=>p.x>-PW-10);
    const cx=bird.x,cy=bird.y,R=17;
    for(const p of pipes){
      if(cx+R>p.x&&cx-R<p.x+PW&&(cy-R<p.top||cy+R>p.top+GAP))return die();
    }
    if(cy+R>=GROUND)return die();
    if(cy-R<-40){bird.y=-40+R;bird.v=0}
  }else if(bird.y+22>=GROUND){bird.y=GROUND-22;bird.v=0;bird.r=1.2}
}
function pipe(x,y,h,flip){
  ctx.fillStyle='#5cb82f';ctx.fillRect(x,y,PW,h);
  ctx.fillStyle='#8be04a';ctx.fillRect(x+6,y,10,h);
  ctx.fillStyle='#3d8a1e';ctx.fillRect(x+PW-14,y,14,h);
  const ly=flip?y+h-30:y;
  ctx.fillStyle='#5cb82f';ctx.fillRect(x-5,ly,PW+10,30);
  ctx.fillStyle='#8be04a';ctx.fillRect(x+1,ly,10,30);
  ctx.fillStyle='#3d8a1e';ctx.fillRect(x+PW-14,ly,19,30);
  ctx.strokeStyle='#1d3d0e';ctx.lineWidth=3;
  ctx.strokeRect(x,y,PW,h);ctx.strokeRect(x-5,ly,PW+10,30);
}
function text(t,x,y,size,col='#fff'){
  ctx.font=size+'px "Press Start 2P","Courier New",monospace';ctx.textAlign='center';
  ctx.lineWidth=size/4+2;ctx.strokeStyle='#1d2b36';ctx.lineJoin='round';
  ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);
}
function draw(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}
  let g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#3fc1ec');g.addColorStop(1,'#a5e6f7');
  ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='#fff';ctx.globalAlpha=.85;
  clouds.forEach(c=>{const s=c.s*28;ctx.fillRect(c.x,c.y,s*4,s);ctx.fillRect(c.x+s*.7,c.y-s*.7,s*2.2,s*.8);ctx.fillRect(c.x-s*.4,c.y+s*.3,s*4.8,s*.7)});
  ctx.globalAlpha=1;
  ctx.fillStyle='#46b0e8';
  for(let i=0;i<8;i++){const h=50+((i*37)%50);ctx.fillRect(i*70-20,GROUND-h-40,90,h+40)}
  ctx.fillStyle='#4caf50';
  for(let i=0;i<6;i++){const h=40+((i*53)%45);ctx.fillRect(i*95-30,GROUND-h,110,h)}
  pipes.forEach(p=>{pipe(p.x,0,p.top,true);pipe(p.x,p.top+GAP,GROUND-p.top-GAP,false)});
  ctx.fillStyle='#6cc72c';ctx.fillRect(0,GROUND,W,14);
  ctx.fillStyle='#1d2b36';ctx.fillRect(0,GROUND,W,3);
  ctx.fillStyle='#4aa01e';for(let x=groundX-24;x<W+24;x+=24){ctx.beginPath();ctx.moveTo(x,GROUND+3);ctx.lineTo(x+12,GROUND+3);ctx.lineTo(x,GROUND+15);ctx.lineTo(x-12,GROUND+15);ctx.fill()}
  ctx.fillStyle='#ddd08a';ctx.fillRect(0,GROUND+14,W,H-GROUND);
  ctx.fillStyle='#c4b46e';ctx.fillRect(0,GROUND+14,W,4);
  pipes.forEach(drawGuy);
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.r);
  if(img.complete&&img.naturalWidth)ctx.drawImage(img,-BW/2,-BH/2,BW,BH);
  else{ctx.fillStyle='#fd0';ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill()}
  ctx.restore();
  if(state==='play')text(score,W/2,90,44);
  if(state==='ready'){
    text('PLAY YOUR',W/2,170,34,'#ffd23f');text('THUMBI',W/2,220,34,'#ffd23f');
    text('TAP or SPACE to flap',W/2,H-60,14);
    text('Best '+best,W/2,H-30,12);
  }
  if(state==='over'){
    text('GAME OVER',W/2,210,34,'#ff6b5b');
    ctx.fillStyle='#ffeeb5';ctx.fillRect(W/2-120,260,240,150);
    ctx.strokeStyle='#1d2b36';ctx.lineWidth=5;ctx.strokeRect(W/2-120,260,240,150);
    ctx.font='14px "Press Start 2P","Courier New",monospace';ctx.textAlign='center';ctx.fillStyle='#8a5a1f';
    ctx.fillText('SCORE',W/2,300);ctx.fillText('BEST',W/2,365);
    text(score,W/2,336,28);text(best,W/2,400,28,'#ffd23f');
    if(overT>25)text('TAP to retry',W/2,480,16);
  }
  if(state==='select')drawSelect();
  ctx.restore();
}
function drawSelect(){
  ctx.fillStyle='rgba(18,48,63,.45)';ctx.fillRect(0,0,W,GROUND);
  text('SELECT YOUR',W/2,150,30,'#ffd23f');text('THUMBI',W/2,200,30,'#ffd23f');
  CARDS.forEach((c,i)=>{
    const on=i===sel,bob=on?Math.sin(frame/8)*5:0;
    ctx.fillStyle=on?'#fff3c4':'#ffeeb5';ctx.fillRect(c.x,c.y,c.w,c.h);
    ctx.strokeStyle=on?'#ff6b5b':'#1d2b36';ctx.lineWidth=on?8:5;ctx.strokeRect(c.x,c.y,c.w,c.h);
    const im=imgs[i],dw=104,dh=dw*(im.naturalHeight||173)/(im.naturalWidth||200);
    if(im.complete&&im.naturalWidth)ctx.drawImage(im,c.x+c.w/2-dw/2,c.y+95-dh/2+bob,dw,dh);
    const L=[['KALIPPAN','THUMBI'],['NAUGHTY','THUMBI'],['YOUNG','THUMBI']][i],col=on?'#ff6b5b':'#fff';text(L[0],c.x+c.w/2,c.y+c.h-50,13,col);text(L[1],c.x+c.w/2,c.y+c.h-24,13,col);
  });
  text('Tap a bird to play',W/2,H-60,13);
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script></body></html>
